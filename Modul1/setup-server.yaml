---
- name: Setup Nginx as Reverse Proxy
  hosts: all
  become: yes
  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Copy Nginx configuration
      copy:
        src: ./nginx.conf
        dest: /etc/nginx/sites-available/default
        mode: '0644'

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted