name: CI/CD Pipeline NETICS

on:
  push:
    branches:
      - main
    paths:
      - 'Modul1/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./Modul1
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/netics-api:latest

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/netics-api:latest
            sudo docker stop netics-api || true
            sudo docker rm netics-api || true
            sudo docker run -d -p 8080:8080 --name netics-api ${{ secrets.DOCKER_USERNAME }}/netics-api:latest